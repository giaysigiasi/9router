name: Combo Health Smoke

on:
  push:
    branches: [main]

jobs:
  combo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run combo health smoke
        run: node scripts/test-combo-local.mjs --source-only --json
