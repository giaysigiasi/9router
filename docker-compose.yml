# 9Router local dev stack.
# Build:  docker compose build
# Up:     docker compose up -d
# Logs:   docker compose logs -f
# Down:   docker compose down -v
services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router:local
    container_name: 9router-source
    restart: unless-stopped
    ports:
      - "20130:20130"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20130"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      COMBO_HEALTH_POLL_MS: "7200000"
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped
    ports:
      - "8788:8787"

volumes:
  9router-data:
    name: 9router-data
